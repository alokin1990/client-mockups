<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magnolia Pharmacy Homepage Mockups</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, sans-serif;
        color: #0a2c31;
        background: #eef8f9;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main {
        width: min(820px, calc(100% - 40px));
        margin: 64px auto;
        padding: clamp(28px, 6vw, 56px);
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 50px rgba(10, 44, 49, 0.12);
      }
      .eyebrow {
        color: #157a8a;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 { margin: 10px 0 14px; font-size: clamp(2.25rem, 6vw, 4rem); line-height: 1; }
      p { color: #496166; line-height: 1.65; }
      nav { display: grid; gap: 14px; margin-top: 34px; }
      a {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding: 20px 22px;
        border: 1px solid #c8dadd;
        border-radius: 12px;
        color: #0a2c31;
        background: #f8fcfc;
        font-weight: 800;
        text-decoration: none;
      }
      a:hover, a:focus-visible { border-color: #157a8a; background: #e8f7f8; }
      span { color: #157a8a; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Magnolia Pharmacy</p>
      <h1>Homepage mockups</h1>
      <p>Compare the three approved review treatments. Each version keeps the same core content while presenting a different hero direction.</p>
      <nav aria-label="Magnolia Pharmacy homepage versions">
        <a href="homepage-v003-review/">Version 3 <span>Portrait hero →</span></a>
        <a href="homepage-v004-review/">Version 4 <span>Team-background hero →</span></a>
        <a href="homepage-v005-review/">Version 5 <span>Founder-background hero →</span></a>
      </nav>
    </main>
  </body>
</html>
