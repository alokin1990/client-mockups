:root[data-theme=&quot;light&quot;] {

&lt;p class=&quot;method-note text-small&quot;&gt;Estimated qualified leads are the 9 supported ZIP assignments for paid Google phone calls marked quotable in WhatConverts across 8 accepted dates, not a projection of all 90-day leads. 7 other qualified calls have no supported ZIP.&lt;/p&gt;
&lt;p class=&quot;method-note text-small&quot;&gt;CPA = 90-day Google Ads cost ÷ 90-day Google Ads conversions. Band CPA uses total band cost ÷ total band conversions, not an average of ZIP CPAs. A dash means zero Ads conversions. Quotable-call estimates and chart bar shares still use the 8 accepted dates; they are separate from the CPA calculation. A zero estimated call count means no accepted ZIP assignment, not proof of no qualified calls from that ZIP.&lt;/p&gt;
&lt;details id=&quot;matching-method&quot;&gt;&lt;summary&gt;View the 8 accepted dates and matching checks&lt;/summary&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;All accepted quotable calls have a unique Ads call candidate within 30 seconds of start time and 2 seconds of duration, checked in both directions. Account and ZIP qualified-call totals must equal the WhatConverts count that local day. Fractional ZIP credit, missing ZIPs and count mismatches are excluded. Confidence is rule-based; no measured match accuracy is available.&lt;/p&gt;&lt;section aria-labelledby=&quot;accepted-table-title&quot;&gt;&lt;h2 id=&quot;accepted-table-title&quot;&gt;Accepted-date checks&lt;/h2&gt;&lt;div class=&quot;report-table-wrap&quot;&gt;&lt;table class=&quot;report-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Date · Eastern time&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Quotable calls&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Time/duration matches&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Ads qualified-call actions&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Estimated ZIP counts&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Basis&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;accepted-days-body&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/section&gt;&lt;/details&gt;
&lt;div class=&quot;method-note text-small&quot;&gt;Full-account and 90-day ZIP performance use the saved Docker totals, including ZIPs with zero conversions. Call qualification uses paid Google WhatConverts phone calls with quotable = Yes, excluding spam or misdial. The daily match uses the verified WC Qualified Call from Google Ads Calls from Ads action by conversion date and the account&#x27;s Eastern timezone. ZIP comes from Google&#x27;s physical-user attribution, not WhatConverts ZIP fields. Routes run from US ZIP representative points to 10601 Greenyard Road, Chester, Virginia 23831, US. This is driving distance, not straight-line radius or a patient address. 7 quotable calls remain without an accepted ZIP estimate.&lt;/div&gt;
